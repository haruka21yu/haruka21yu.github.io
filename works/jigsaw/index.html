  <script>
    var FREE_IMAGES = [
      { title:'雪山',     url:'https://picsum.photos/id/29/800/600'  },
      { title:'ターンテーブル',       url:'https://picsum.photos/id/39/800/600'  },
      { title:'森',       url:'https://picsum.photos/id/83/800/600'  },
      { title:'海辺の木々',   url:'https://picsum.photos/id/10/800/600'  },
      { title:'ワゴンホイール',     url:'https://picsum.photos/id/99/800/600'  },
      { title:'コンサート',       url:'https://picsum.photos/id/117/800/600' },
      { title:'車',       url:'https://picsum.photos/id/133/800/600' },
      { title:'トンネル',         url:'https://picsum.photos/id/137/800/600' },
      { title:'ギター',       url:'https://picsum.photos/id/145/800/600' },
      { title:'葉',     url:'https://picsum.photos/id/167/800/600' },
      { title:'時計',     url:'https://picsum.photos/id/175/800/600' },
      { title:'高層ビル',   url:'https://picsum.photos/id/214/800/600' },
      { title:'電球',     url:'https://picsum.photos/id/232/800/600' },
      { title:'サボテン',       url:'https://picsum.photos/id/247/800/600' },
      { title:'鳥の群れ',       url:'https://picsum.photos/id/258/800/600' },
      { title:'夜間の高層ビル',       url:'https://picsum.photos/id/274/800/600' },
      { title:'ハチミツ',     url:'https://picsum.photos/id/312/800/600' },
      { title:'海岸',     url:'https://picsum.photos/id/338/800/600' },
      { title:'ジャンプする男',       url:'https://picsum.photos/id/390/800/600' },
      { title:'タイプライター',       url:'https://picsum.photos/id/403/800/600' },
    ];
  
    var G = {
      cols:0, rows:0,
      pieces:[],
      dragging:null,
      dragOffX:0, dragOffY:0,
      image:null,
      canvasW:0, canvasH:0,
      pieceW:0, pieceH:0,
      trayPieceW:0, trayPieceH:0,
      trayColCount:0,
      trayW:0, trayH:0,
      selectedFreeUrl:null,
    };
  
    var KNOB      = 0.20;
    var SNAP_DIST = 22;
    var TRAY_PAD  = 6;

    var SIZE_PRESETS = [
      { label:'70ピース',   sizes:[{c:5,r:14},{c:14,r:5},{c:7,r:10},{c:10,r:7}] },
      { label:'100ピース',  sizes:[{c:10,r:10}] },
      { label:'108ピース',  sizes:[{c:6,r:18},{c:18,r:6},{c:9,r:12},{c:12,r:9}] },
      { label:'216ピース',  sizes:[{c:9,r:24},{c:24,r:9},{c:12,r:18},{c:18,r:12}] },
      { label:'300ピース',  sizes:[{c:10,r:30},{c:30,r:10},{c:12,r:25},{c:25,r:12},{c:15,r:20},{c:20,r:15}] },
      { label:'450ピース',  sizes:[{c:15,r:30},{c:30,r:15},{c:18,r:25},{c:25,r:18}] },
      { label:'500ピース',  sizes:[{c:20,r:25},{c:25,r:20}] },
      { label:'1000ピース', sizes:[{c:20,r:50},{c:50,r:20},{c:25,r:40},{c:40,r:25}] },
      { label:'1053ピース', sizes:[{c:27,r:39},{c:39,r:27}] },
      { label:'1500ピース', sizes:[{c:25,r:60},{c:60,r:25},{c:30,r:50},{c:50,r:30}] },
      { label:'2000ピース', sizes:[{c:40,r:50},{c:50,r:40}] },
      { label:'2016ピース', sizes:[{c:28,r:72},{c:72,r:28},{c:32,r:63},{c:63,r:32},{c:36,r:56},{c:56,r:36},{c:42,r:48},{c:48,r:42}] },
      { label:'3000ピース', sizes:[{c:40,r:75},{c:75,r:40},{c:50,r:60},{c:60,r:50}] },
    ];
    
    function renderSizeGroups() {
      var wrap = document.getElementById('size-groups');
      SIZE_PRESETS.forEach(function(group, gi) {
        var gDiv = document.createElement('div');
        gDiv.style.marginBottom = '10px';
        var lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:4px;';
        lbl.textContent = group.label;
        gDiv.appendChild(lbl);
        var btns = document.createElement('div');
        btns.className = 'size-btns';
        group.sizes.forEach(function(s, i) {
          var btn = document.createElement('div');
          btn.className = 'pill';
          btn.dataset.cols = s.c; btn.dataset.rows = s.r;
          btn.textContent = s.c + '×' + s.r;
          btn.onclick = function(){ pickSize(btn); };
          if (gi === 0 && i === 0) {
            btn.classList.add('active');
            G.cols = s.c; G.rows = s.r;
          }
          btns.appendChild(btn);
        });
        gDiv.appendChild(btns);
        wrap.appendChild(gDiv);
      });
    }
    
    function renderFreeImages() {
      var wrap = document.getElementById('free-images');
      FREE_IMAGES.forEach(function(img) {
        var div = document.createElement('div');
        div.className = 'free-img-item';
        div.title = img.title;
        div.onclick = function() {
          document.querySelectorAll('.free-img-item').forEach(function(d){ d.classList.remove('selected'); });
          div.classList.add('selected');
          G.selectedFreeUrl = img.url;
        };
        var el = document.createElement('img');
        el.src = img.url; el.alt = img.title; el.crossOrigin = 'anonymous';
        div.appendChild(el);
        wrap.appendChild(div);
      });
    }
  
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(function(b, i){
        b.classList.toggle('active', (i===0&&name==='free')||(i===1&&name==='upload'));
      });
      document.getElementById('tab-free').classList.toggle('active', name==='free');
      document.getElementById('tab-upload').classList.toggle('active', name==='upload');
    }
    
    function pickSize(btn) {
      document.querySelectorAll('.size-btns .pill').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      G.cols = parseInt(btn.dataset.cols);
      G.rows = parseInt(btn.dataset.rows);
    }
    
    function startGame() {
      var inp = document.getElementById('upload-input');
      if (inp.files && inp.files[0]) {
        var r = new FileReader();
        r.onload = function(e){ loadImageAndStart(e.target.result); };
        r.readAsDataURL(inp.files[0]);
        return;
      }
      if (G.selectedFreeUrl) { loadImageAndStart(G.selectedFreeUrl); return; }
      var msg = document.getElementById('setup-msg');
      msg.style.display = 'block';
      setTimeout(function(){ msg.style.display='none'; }, 2000);
    }
  
    function loadImageAndStart(src) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        G.image = img;
        document.getElementById('preview-img').src = src;
        initPuzzle();
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('game-area').style.display  = 'block';
        document.getElementById('complete-msg').classList.remove('show');
      };
      img.onerror = function(){ alert('画像の読み込みに失敗しました。'); };
      img.src = src;
    }
    
    function initPuzzle() {
      var maxW   = Math.min(window.innerWidth - 32, 700);
      var aspect = G.image.naturalWidth / G.image.naturalHeight;
      G.canvasW  = maxW;
      G.canvasH  = Math.round(maxW / aspect);
      G.pieceW   = G.canvasW / G.cols;
      G.pieceH   = G.canvasH / G.rows;
    
      var pCanvas = document.getElementById('puzzle-canvas');
      var pWrap   = document.getElementById('canvas-wrap');
      pCanvas.width  = G.canvasW;
      pCanvas.height = G.canvasH;
      pWrap.style.width  = G.canvasW + 'px';
      pWrap.style.height = G.canvasH + 'px';
    
      var hEdge = [], vEdge = [];
      for (var r = 0; r < G.rows-1; r++) {
        hEdge[r] = [];
        for (var c = 0; c < G.cols; c++)
          hEdge[r][c] = Math.random()<0.5 ? 1 : -1;
      }
      for (var r2 = 0; r2 < G.rows; r2++) {
        vEdge[r2] = [];
        for (var c2 = 0; c2 < G.cols-1; c2++)
          vEdge[r2][c2] = Math.random()<0.5 ? 1 : -1;
      }
    
      G.pieces = [];
      for (var row = 0; row < G.rows; row++) {
        for (var col = 0; col < G.cols; col++) {
          var topDir    = (row>0)        ? -hEdge[row-1][col] : 0;
          var bottomDir = (row<G.rows-1) ?  hEdge[row][col]   : 0;
          var leftDir   = (col>0)        ? -vEdge[row][col-1] : 0;
          var rightDir  = (col<G.cols-1) ?  vEdge[row][col]   : 0;
          G.pieces.push({
            row:row, col:col,
            x:0, y:0,
            targetX: G.pieceW * col,
            targetY: G.pieceH * row,
            top:topDir, bottom:bottomDir, left:leftDir, right:rightDir,
            placed:false, inTray:true, trayIdx:G.pieces.length,
          });
        }
      }
    
      shuffleArr(G.pieces);
      G.pieces.forEach(function(p, i){ p.trayIdx = i; });
    
      initTray();
      setupEvents();
      drawAll();
      updateRemain();
    }

    function initTray() {
      var visW  = Math.min(window.innerWidth - 32, 700);
      var scale = Math.min(1, visW / (G.pieceW * 4 + TRAY_PAD * 5));
      G.trayPieceW   = Math.round(G.pieceW * scale);
      G.trayPieceH   = Math.round(G.pieceH * scale);
      G.trayColCount = Math.max(1, Math.floor((visW - TRAY_PAD) / (G.trayPieceW + TRAY_PAD)));
    
      var total    = G.pieces.length;
      var trayRows = Math.ceil(total / G.trayColCount);
      G.trayW = G.trayColCount * (G.trayPieceW + TRAY_PAD) + TRAY_PAD;
      G.trayH = trayRows * (G.trayPieceH + TRAY_PAD) + TRAY_PAD;
    
      var tCanvas = document.getElementById('tray-canvas');
      var tWrap   = document.getElementById('tray-canvas-wrap');
      tCanvas.width  = G.trayW;
      tCanvas.height = G.trayH;
      tWrap.style.width  = visW + 'px';
      tWrap.style.height = Math.min(G.trayH, G.trayPieceH * 3 + TRAY_PAD * 4) + 'px';
    }

    function reindexTray() {
      var tPieces = G.pieces.filter(function(p){ return p.inTray; });
      tPieces.forEach(function(p, i){ p.trayIdx = i; });
      var trayRows = Math.max(1, Math.ceil(tPieces.length / G.trayColCount));
      var newH = trayRows * (G.trayPieceH + TRAY_PAD) + TRAY_PAD;
      var tCanvas = document.getElementById('tray-canvas');
      tCanvas.height = newH;
      G.trayH = newH;
    }

    function setupEvents() {
      var pCanvas = document.getElementById('puzzle-canvas');
      var tCanvas = document.getElementById('tray-canvas');
      pCanvas.addEventListener('mousedown',  function(e){ onDown(e,'board'); });
      tCanvas.addEventListener('mousedown',  function(e){ onDown(e,'tray');  });
      pCanvas.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e.touches[0],'board'); }, {passive:false});
      tCanvas.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e.touches[0],'tray');  }, {passive:false});
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
      document.addEventListener('touchmove', function(e){ if(G.dragging) e.preventDefault(); onMove(e.touches[0]); }, {passive:false});
      document.addEventListener('touchend',  function(e){ onUp(e); });
    }
  
    function setupCanvas() {
      var canvas = document.getElementById('puzzle-canvas');
      canvas.onmousedown  = onDown;
      canvas.onmousemove  = onMove;
      canvas.onmouseup    = onUp;
      canvas.ontouchstart = function(e){ e.preventDefault(); onDown(e.touches[0]); };
      canvas.ontouchmove  = function(e){ e.preventDefault(); onMove(e.touches[0]); };
      canvas.ontouchend   = function(e){ e.preventDefault(); onUp(); };
    }

    function boardPos(e) {
      var r = document.getElementById('puzzle-canvas').getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    
    function trayPos(e) {
      var r = document.getElementById('tray-canvas').getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    
    function getPos(e) {
      var canvas = document.getElementById('puzzle-canvas');
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
  
    function onDown(e, source) {
      if (source === 'board') {
        var pos = boardPos(e);
        for (var i = G.pieces.length-1; i >= 0; i--) {
          var p = G.pieces[i];
          if (p.placed || p.inTray) continue;
          if (hitBoard(p, pos.x, pos.y)) {
            startDrag(p, i, pos.x - p.x, pos.y - p.y);
            return;
          }
        }
      } else {
        var tp = trayPos(e);
        var tPieces = G.pieces.filter(function(p){ return p.inTray; });
        for (var j = tPieces.length-1; j >= 0; j--) {
          var piece = tPieces[j];
          var pp = getTrayPos(piece.trayIdx);
          if (tp.x >= pp.x && tp.x <= pp.x + G.trayPieceW &&
              tp.y >= pp.y && tp.y <= pp.y + G.trayPieceH) {
            piece.inTray = false;
            var pRect = document.getElementById('puzzle-canvas').getBoundingClientRect();
            var tRect = document.getElementById('tray-canvas').getBoundingClientRect();
            var screenX = tRect.left + pp.x + G.trayPieceW/2;
            var screenY = tRect.top  + pp.y + G.trayPieceH/2;
            piece.x = screenX - pRect.left - G.pieceW/2;
            piece.y = screenY - pRect.top  - G.pieceH/2;
            var idx3 = G.pieces.indexOf(piece);
            startDrag(piece, idx3, G.pieceW/2, G.pieceH/2);
            reindexTray();
            return;
          }
        }
      }
    }

    function startDrag(p, idx, offX, offY) {
      G.dragging = p;
      G.dragOffX = offX;
      G.dragOffY = offY;
      G.pieces.splice(idx, 1);
      G.pieces.push(p);
      drawAll();
    }
    
    function onMove(e) {
      if (!G.dragging) return;
      var pRect = document.getElementById('puzzle-canvas').getBoundingClientRect();
      G.dragging.x = e.clientX - pRect.left - G.dragOffX;
      G.dragging.y = e.clientY - pRect.top  - G.dragOffY;
      drawAll();
    }
    
    function onUp(e) {
      if (!G.dragging) return;
      var p = G.dragging;
      G.dragging = null;
      var cx = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX) || 0;
      var cy = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) || 0;
      var pRect = document.getElementById('puzzle-canvas').getBoundingClientRect();
      var onBoard = cx >= pRect.left && cx <= pRect.right && cy >= pRect.top && cy <= pRect.bottom;
      if (onBoard) {
        var dx = Math.abs(p.x - p.targetX);
        var dy = Math.abs(p.y - p.targetY);
        if (dx < SNAP_DIST && dy < SNAP_DIST) {
          p.x = p.targetX; p.y = p.targetY;
          p.placed = true; p.inTray = false;
        } else {
          p.inTray = false;
        }
      } else {
        p.inTray = true; p.placed = false;
        reindexTray();
      }
      drawAll();
      updateRemain();
      checkComplete();
    }
  
    function hitTest(p, mx, my) {
      var kx = G.pieceW * KNOB;
      var ky = G.pieceH * KNOB;
      var x1 = p.x - (p.left < 0 ? kx : 0);
      var y1 = p.y - (p.top  < 0 ? ky : 0);
      var x2 = p.x + G.pieceW + (p.right  > 0 ? kx : 0);
      var y2 = p.y + G.pieceH + (p.bottom > 0 ? ky : 0);
      return mx >= x1 && mx <= x2 && my >= y1 && my <= y2;
    }
  
    function hitBoard(p, mx, my) {
      var kx = G.pieceW * KNOB;
      var ky = G.pieceH * KNOB;
      return mx >= p.x - kx && mx <= p.x + G.pieceW + kx &&
             my >= p.y - ky && my <= p.y + G.pieceH + ky;
    }
    
    function drawAll() {
      drawBoard();
      drawTray();
    }
  
    function drawBoard() {
      var canvas = document.getElementById('puzzle-canvas');
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, G.canvasW, G.canvasH);
    
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.07)';
      ctx.lineWidth = 0.5;
      for (var r = 0; r <= G.rows; r++) {
        ctx.beginPath(); ctx.moveTo(0, r*G.pieceH); ctx.lineTo(G.canvasW, r*G.pieceH); ctx.stroke();
      }
      for (var c = 0; c <= G.cols; c++) {
        ctx.beginPath(); ctx.moveTo(c*G.pieceW, 0); ctx.lineTo(c*G.pieceW, G.canvasH); ctx.stroke();
      }
      ctx.restore();
    
      G.pieces.forEach(function(p) {
        if (p.placed && !p.inTray) drawPiece(ctx, p.x, p.y, p, false, 1);
      });
      G.pieces.forEach(function(p) {
        if (!p.placed && !p.inTray && p !== G.dragging) drawPiece(ctx, p.x, p.y, p, false, 1);
      });
      if (G.dragging && !G.dragging.inTray) {
        drawPiece(ctx, G.dragging.x, G.dragging.y, G.dragging, true, 0.88);
      }
    }
    
    function drawTray() {
      var canvas = document.getElementById('tray-canvas');
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, G.trayW, G.trayH);
      var scaleX = G.trayPieceW / G.pieceW;
      var scaleY = G.trayPieceH / G.pieceH;
      G.pieces.forEach(function(p) {
        if (!p.inTray) return;
        var pos = getTrayPos(p.trayIdx);
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(scaleX, scaleY);
        drawPiece(ctx, 0, 0, p, false, 1);
        ctx.restore();
      });
    }
    
    function drawPiece(ctx, x, y, p, isDragging, alpha) {
      var pw = G.pieceW;
      var ph = G.pieceH;
      var kx = pw * KNOB;
      var ky = ph * KNOB;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      if (isDragging) {
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur  = 8;
        ctx.shadowOffsetX = 4;
        ctx.shadowOffsetY = 4;
      }
      ctx.save();
      ctx.beginPath();
      buildPath(ctx, pw, ph, kx, ky, p.top, p.bottom, p.left, p.right);
      ctx.clip();
      ctx.drawImage(
        G.image,
        p.col * pw / G.canvasW * G.image.naturalWidth,
        p.row * ph / G.canvasH * G.image.naturalHeight,
        pw / G.canvasW * G.image.naturalWidth,
        ph / G.canvasH * G.image.naturalHeight,
        0, 0, pw, ph
      );
      ctx.restore();
      ctx.beginPath();
      buildPath(ctx, pw, ph, kx, ky, p.top, p.bottom, p.left, p.right);
      ctx.strokeStyle = p.placed ? 'rgba(0,0,0,0.1)' : (isDragging ? 'rgba(0,0,0,0.7)' : 'rgba(0,0,0,0.3)');
      ctx.lineWidth   = isDragging ? 1.5 : 0.8;
      ctx.stroke();
      ctx.restore();
    }
    
    function buildPath(ctx, pw, ph, kx, ky, top, bottom, left, right) {
      var mx = pw / 2;
      var my = ph / 2;
      var r  = Math.min(kx, ky) * 0.52;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(mx - r, 0);
      if (top !== 0) {
        ctx.arc(mx, top > 0 ? -r : r, r, Math.PI, 0, top < 0);
      }
      ctx.lineTo(pw, 0);
      ctx.lineTo(pw, my - r);
      if (right !== 0) {
        ctx.arc(right > 0 ? pw + r : pw - r, my, r, -Math.PI/2, Math.PI/2, right < 0);
      }
      ctx.lineTo(pw, ph);
      ctx.lineTo(mx + r, ph);
      if (bottom !== 0) {
        ctx.arc(mx, bottom > 0 ? ph + r : ph - r, r, 0, Math.PI, bottom < 0);
      }
      ctx.lineTo(0, ph);
      ctx.lineTo(0, my + r);
      if (left !== 0) {
        ctx.arc(left > 0 ? -r : r, my, r, Math.PI/2, -Math.PI/2, left < 0);
      }
      ctx.lineTo(0, 0);
      ctx.closePath();
    }
  
    function updateRemain() {
      var n = G.pieces.filter(function(p){ return !p.placed; }).length;
      document.getElementById('remain-count').textContent = n;
    }
    
    function checkComplete() {
      if (G.pieces.every(function(p){ return p.placed; })) {
        document.getElementById('complete-msg').classList.add('show');
      }
    }
    
    function resetToSetup() {
      document.getElementById('setup-area').style.display = '';
      document.getElementById('game-area').style.display  = 'none';
      document.getElementById('complete-msg').classList.remove('show');
    }
    
    function shuffleArr(arr) {
      for (var i = arr.length-1; i > 0; i--) {
        var j = Math.floor(Math.random()*(i+1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
  
    renderFreeImages();
    renderSizeGroups();
  </script>
</body>
